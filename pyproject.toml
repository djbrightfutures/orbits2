[project]
name = "orbits2"
version = "2.0.0"
description = "Hands before the model. One orbit file every brain can resume."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Christian Rivera" }]

[project.scripts]
orbits2 = "orbits2.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orbits2*"]
